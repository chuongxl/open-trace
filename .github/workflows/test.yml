name: integration-test
on:
  push:
    branches: [feat/phase-3-opencode-watcher]
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: set -o pipefail; npm test 2>&1 | tee /tmp/ot-test.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-output
          path: /tmp/ot-test.log